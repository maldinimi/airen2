# Mode pengembangan: kode di-mount dengan hot reload — developer tidak perlu menginstal Python/Node di laptop.
services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    volumes:
      - ./data:/data
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/migrasi:/app/migrasi

  migrasi:
    volumes:
      - ./data:/data
      - ./backend/app:/app/app
      - ./backend/migrasi:/app/migrasi

  # Akses GUI database (DBeaver/pgAdmin) dari laptop ini saja: 127.0.0.1:5433 → db:5432.
  # Jaringan `internal` tidak dapat meneruskan port, dan menyambungkan db ke jaringan lain memberinya
  # jalur ke internet (B1). Jadi db tetap internal; penerus kecil ini (pola sama dengan `web`) yang menjembatani.
  db-gui:
    image: airen-backend:${VERSI_APP:-1.0.0}
    command: ["python", "/alat/teruskan_tcp.py", "db", "5432"]
    volumes:
      - ./scripts/teruskan_tcp.py:/alat/teruskan_tcp.py:ro
    ports: ["127.0.0.1:5433:5432"]
    networks: [internal, publik]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  worker:
    volumes:
      - ./data:/data
      - ./backend/app:/app/app

  web:
    build:
      context: ./frontend
      target: dev
    image: airen-web-dev:${VERSI_APP:-1.0.0}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports: !override
      - "${PORT_WEB:-8080}:8080"
