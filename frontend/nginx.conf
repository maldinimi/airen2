# Layanan web produksi: SPA statis + proxy /api ke kontainer api.
# CSP hanya mengizinkan sumber 'self' → browser tidak dapat memanggil domain lain mana pun (B1).
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1g;   # batas per file PDF (100 MB) divalidasi API; unggah panduan dapat berisi beberapa file

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri /index.html;
    }
}
